[versions]
asm = "9.11.1"
beanshell = "2.0b6"
groovy = "5.1.3"
jmh = "1.37"
junit = "5.14.4"
junit-platform = "1.14.4"
rhino = "1.9.1"

[libraries]
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
beanshell = { module = "org.apache-extras.beanshell:bsh", version.ref = "beanshell" }
groovy = { module = "org.apache.groovy:groovy", version.ref = "groovy" }
