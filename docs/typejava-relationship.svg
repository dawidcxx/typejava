<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">TypeJava relationship to TypeScript and JavaScript</title>
  <desc id="desc">TypeScript is a superset of JavaScript. TypeJava is a smaller language inside TypeScript that also overlaps JavaScript.</desc>

  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="916" height="476" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <circle cx="350" cy="260" r="200" fill="#3178c6" fill-opacity="0.07" stroke="#3178c6" stroke-opacity="0.75" stroke-width="2.5"/>

    <circle cx="290" cy="285" r="118" fill="#f7df1e" fill-opacity="0.42" stroke="#c5aa05" stroke-opacity="0.9" stroke-width="2.5"/>

    <circle cx="385" cy="250" r="70" fill="#6366f1" fill-opacity="0.34" stroke="#4f46e5" stroke-width="2.5"/>

    <text x="350" y="104" text-anchor="middle" font-size="27" font-weight="700" fill="#1e3a5f">TypeScript</text>
    <text x="350" y="128" text-anchor="middle" font-size="13" font-weight="500" fill="#506783">JavaScript plus static types</text>

    <text x="242" y="354" text-anchor="middle" font-size="20" font-weight="700" fill="#5b4a00">JavaScript</text>
    <text x="242" y="375" text-anchor="middle" font-size="12" font-weight="500" fill="#6f5f13">dynamic runtime</text>

    <text x="386" y="247" text-anchor="middle" font-size="19" font-weight="700" fill="#312e81">TypeJava</text>
    <text x="386" y="267" text-anchor="middle" font-size="11" font-weight="600" fill="#4338ca">JVM scripting</text>

    <line x1="632" y1="164" x2="632" y2="392" stroke="#e2e8f0" stroke-width="1.5"/>

    <text x="668" y="174" font-size="11" font-weight="700" letter-spacing="1.6" fill="#64748b">RELATIONSHIP</text>

    <circle cx="676" cy="218" r="9" fill="#3178c6" fill-opacity="0.12" stroke="#3178c6" stroke-width="2.5"/>
    <text x="700" y="216" font-size="16" font-weight="700" fill="#0f172a">TypeScript</text>
    <text x="700" y="237" font-size="12.5" font-weight="500" fill="#64748b">Superset of JavaScript</text>

    <circle cx="676" cy="286" r="9" fill="#f7df1e" fill-opacity="0.42" stroke="#c5aa05" stroke-width="2.5"/>
    <text x="700" y="284" font-size="16" font-weight="700" fill="#0f172a">JavaScript</text>
    <text x="700" y="305" font-size="12.5" font-weight="500" fill="#64748b">Dynamic runtime baseline</text>

    <circle cx="676" cy="354" r="9" fill="#6366f1" fill-opacity="0.34" stroke="#4f46e5" stroke-width="2.5"/>
    <text x="700" y="352" font-size="16" font-weight="700" fill="#0f172a">TypeJava</text>
    <text x="700" y="373" font-size="12.5" font-weight="500" fill="#64748b">Inside TypeScript; overlaps</text>
    <text x="700" y="390" font-size="12.5" font-weight="500" fill="#64748b">JavaScript</text>

    <text x="668" y="450" font-size="11.5" font-weight="500" fill="#94a3b8">Illustrative relationship only.</text>
  </g>
</svg>
